<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פורטל סוכנים - SAP Business One</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sap: {
                            blue: '#0070F2', // צבע ה-SAP המוכר
                            light: '#F5F9FF'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <header class="bg-white shadow-sm sticky top-0 z-10 p-5 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">שלום, יונתן</h1>
            <p class="text-xs text-gray-400">Team Hetz | SAP Connected</p>
        </div>
        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-sap-blue font-bold">י</div>
    </header>

    <main class="p-4 space-y-6">
        
        <section class="grid grid-cols-1 gap-4">
            <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
                <p class="text-sm text-gray-500 mb-1">מכירות חודש זה</p>
                <h2 class="text-3xl font-extrabold text-gray-900">₪ 42,500</h2>
                <div class="mt-4 w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                    <div class="bg-sap-blue h-full" style="width: 70%"></div>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-2 gap-4">
            <button class="bg-sap-blue text-white p-5 rounded-3xl flex flex-col items-center shadow-lg active:scale-95 transition">
                <i data-lucide="plus-circle" class="mb-2"></i>
                <span class="text-sm font-semibold">הזמנה חדשה</span>
            </button>
            <button class="bg-white border border-gray-200 p-5 rounded-3xl flex flex-col items-center shadow-sm active:scale-95 transition">
                <i data-lucide="users" class="mb-2 text-gray-600"></i>
                <span class="text-sm font-semibold text-gray-700">לקוחות</span>
            </button>
        </section>

        <section class="bg-white p-5 rounded-3xl border border-gray-200">
            <h3 class="font-bold mb-4">הזמנות אחרונות</h3>
            <div class="space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <div>
                        <p class="text-sm font-bold">לקוח א'</p>
                        <p class="text-xs text-gray-400">לפני שעתיים</p>
                    </div>
                    <span class="text-sm font-semibold text-green-600">₪ 1,200</span>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-sm font-bold">לקוח ב'</p>
                        <p class="text-xs text-gray-400">אתמול</p>
                    </div>
                    <span class="text-sm font-semibold text-green-600">₪ 3,500</span>
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 px-6 py-4 flex justify-around">
        <a href="#" class="text-sap-blue"><i data-lucide="home"></i></a>
        <a href="#" class="text-gray-400"><i data-lucide="file-text"></i></a>
        <a href="#" class="text-gray-400"><i data-lucide="search"></i></a>
    </nav>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
