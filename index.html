<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פורטל סוכנים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

    <header class="p-6 bg-white shadow-sm flex justify-between items-center">
        <h1 class="text-xl font-bold">שלום יונתן</h1>
        <button onclick="window.location.href='login.html'" class="text-red-500 text-sm">יציאה</button>
    </header>

    <main class="p-4 space-y-6">
        <section class="bg-white p-6 rounded-3xl shadow-sm">
            <h2 class="font-bold text-gray-700 mb-2">סיכום מכירות חודשי</h2>
            <div class="text-4xl font-extrabold text-blue-600">₪ 42,500</div>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t p-4 flex justify-around">
        <i data-lucide="layout-dashboard" class="text-blue-600"></i>
        <i data-lucide="file-text" class="text-gray-400"></i>
        <i data-lucide="search" class="text-gray-400"></i>
    </nav>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
