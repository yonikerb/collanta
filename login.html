<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - פורטל סוכנים</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-3xl shadow-lg w-full max-w-sm">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">כניסה למערכת</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">שם משתמש</label>
                <input type="text" id="username" required class="w-full p-3 border border-gray-200 rounded-xl focus:outline-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">סיסמה</label>
                <input type="password" id="password" required class="w-full p-3 border border-gray-200 rounded-xl focus:outline-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">התחבר</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // בהמשך כאן נחבר את הבדיקה מול ה-Backend
            window.location.href = 'index.html'; 
        });
    </script>
</body>
</html>
