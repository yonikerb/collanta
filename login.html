<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - פורטל סוכנים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sap: {
                            blue: '#0070F2',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-sap-blue rounded-3xl mx-auto flex items-center justify-center shadow-lg mb-4">
                <span class="text-white font-bold text-2xl">B1</span>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">שלום שוב!</h2>
            <p class="text-gray-500 text-sm mt-1">התחבר כדי לנהל את המכירות שלך</p>
        </div>

        <form id="loginForm" class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">שם משתמש</label>
                <input type="text" id="username" required 
                    class="w-full p-4 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-sap-blue focus:border-transparent outline-none transition">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">סיסמה</label>
                <input type="password" id="password" required 
                    class="w-full p-4 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-sap-blue focus:border-transparent outline-none transition">
            </div>

            <button type="submit" 
                class="w-full bg-sap-blue text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition active:scale-95">
                התחבר למערכת
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // כאן בהמשך נחבר את הקריאה ל-Backend (Node.js)
            // נכון לעכשיו, הוא פשוט מעביר את הסוכן לדף הבית
            console.log("מבצע התחברות...");
            
            // הדמיית התחברות מוצלחת
            window.location.href = 'index.html'; 
        });
    </script>
</body>
</html>
